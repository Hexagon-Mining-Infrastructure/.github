name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement", "triage"]
body:
  - type: input
    id: jira
    attributes:
      label: Jira issue
      placeholder: CPDS-123
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's stopping you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include example inputs/usage if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: layer
    attributes:
      label: Layer check
      options:
        - label: I've checked this belongs in this repository's layer (generic / HxMIN / live).
          required: true
