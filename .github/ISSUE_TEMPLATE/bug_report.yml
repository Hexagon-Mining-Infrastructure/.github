name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check this is the right repository using the
        [Repository Guide](https://github.com/Hexagon-Mining-Infrastructure/.github/blob/main/docs/repository-guide.md).
        **Never include secrets, account IDs or credentials.**
  - type: input
    id: jira
    attributes:
      label: Jira issue
      placeholder: CPDS-123
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error output (redacted).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal configuration / commands.
      render: shell
  - type: input
    id: version
    attributes:
      label: Module / chart version
      placeholder: v3.2.1
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [dev, qa, staging, uat, production, local / not applicable]
